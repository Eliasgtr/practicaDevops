name: CI/CD Pipeline (Build + Deploy)

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: eliasruiz09
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: eliasruiz09/hola-mundo-devops
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: 'echo "Pushed: ${{ steps.build-push.outputs.digest }}"'

  deploy:
    name: Deploy to Render.com
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Wait for Docker Hub to propagate
        run: sleep 20

      - name: Trigger Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::Falta el secret RENDER_DEPLOY_HOOK_URL"
            echo "Obtenelo en Render Dashboard → tu servicio → Settings → Deploy Hook"
            echo "y pegalo en https://github.com/Eliasgtr/practicaDevops/settings/secrets/actions"
            exit 1
          fi

          echo "Disparando Deploy Hook de Render..."
          status=$(curl -sS -o /tmp/render_hook_response.txt -w "%{http_code}" \
            -X POST "$RENDER_DEPLOY_HOOK_URL")

          body=$(cat /tmp/render_hook_response.txt)
          echo "Status HTTP: $status"
          echo "Respuesta Render: $body"

          if [ "$status" -ge 200 ] && [ "$status" -lt 300 ]; then
            echo "✅ Deploy Hook disparado correctamente"
          else
            echo "::error::Falló el deploy hook (HTTP $status)"
            exit 1
          fi

      - name: Deploy summary
        run: |
          echo "🚀 Deploy completado en Render.com"
          echo "Imagen: eliasruiz09/hola-mundo-devops:latest"
          echo "Commit: ${{ github.sha }}"
