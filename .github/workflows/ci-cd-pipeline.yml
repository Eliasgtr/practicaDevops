name: CI/CD Pipeline (Build + Deploy)

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: eliasruiz09
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: eliasruiz09/hola-mundo-devops
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: 'echo "Pushed: ${{ steps.build-push.outputs.digest }}"'

  deploy:
    name: Deploy to Render.com
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Wait for Docker Hub to propagate
        run: sleep 20

      - name: Trigger Render Deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVICE_ID" ]; then
            echo "::warning::Secrets RENDER_API_KEY/RENDER_SERVICE_ID no configurados."
            echo "Configúralos en Settings → Secrets and variables → Actions"
            exit 1
          fi

          response=$(curl -sS -w "\n%{http_code}" \
            -X POST "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Accept: application/json")

          status=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          if [ "$status" -ge 200 ] && [ "$status" -lt 300 ]; then
            echo "✅ Deploy disparado en Render"
            echo "$body"
          else
            echo "::error::Falló el deploy (HTTP $status)"
            echo "$body"
            exit 1
          fi

      - name: Deploy summary
        run: |
          echo "🚀 Deploy completado en Render.com"
          echo "Imagen: eliasruiz09/hola-mundo-devops:latest"
          echo "Commit: ${{ github.sha }}"
