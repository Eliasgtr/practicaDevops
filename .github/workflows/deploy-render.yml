name: Deploy to Render.com

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Trigger Render Deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Wait for Docker image to be published
        run: |
          echo "Esperando 30s para que Docker Hub procese la imagen..."
          sleep 30

      - name: Trigger Render Deploy via API
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVICE_ID" ]; then
            echo "::error::RENDER_API_KEY y RENDER_SERVICE_ID son obligatorios"
            exit 1
          fi

          echo "Disparando deploy en Render para el servicio $RENDER_SERVICE_ID..."
          response=$(curl -sS -w "\nHTTP_STATUS:%{http_code}" \
            -X POST "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Accept: application/json")

          status=$(echo "$response" | grep "HTTP_STATUS:" | cut -d: -f2)
          body=$(echo "$response" | sed '/HTTP_STATUS:/d')

          echo "Status: $status"
          echo "Response: $body"

          if [ "$status" -ge 200 ] && [ "$status" -lt 300 ]; then
            echo "✅ Deploy disparado correctamente"
          else
            echo "::error::Falló el deploy (HTTP $status)"
            exit 1
          fi

      - name: Deploy summary
        if: success()
        run: |
          echo "🚀 Deploy completado en Render.com"
          echo "Servicio: hola-mundo-devops"
          echo "Trigger: push a main"
          echo "Commit: ${{ github.sha }}"
